name: Generate Snake Animation

on:
  # run every 12 hours
  schedule:
    - cron: "0 */12 * * *"
  # allow manual runs from the Actions tab
  workflow_dispatch:
  # run on push to main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate the snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # one file per line; query params customise the colours.
          # light: pale grey empty cells; dark: visible slate-grey empty cells.
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=ff8a3c&color_dots=#ebedf0,#ffd9a6,#ff9d3c,#ff7a1f,#c2410c
            dist/github-contribution-grid-snake-dark.svg?color_snake=ffce7b&color_dots=#30363d,#5a3a14,#9a6a1f,#ff9d3c,#ffd27a

      - name: Push the SVGs to the "output" branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
