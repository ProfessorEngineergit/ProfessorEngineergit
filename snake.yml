name: Generate Snake Animation

on:
  # run every 12 hours
  schedule:
    - cron: "0 */12 * * *"
  # allow manual runs from the Actions tab
  workflow_dispatch:
  # run on push to main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate the snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # one file per line; query params customise the colours
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=ff8a3c&color_dots=#0d1117,#3a2a14,#8a5a1f,#ff9d3c,#ffd27a
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=ffce7b&color_dots=#0d1117,#3a2a14,#8a5a1f,#ff9d3c,#ffd27a

      - name: Push the SVGs to the "output" branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
