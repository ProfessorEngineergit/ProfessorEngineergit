<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" fill="none" role="img" aria-label="Click to enter my universe - a starship warping past a galaxy, a ringed planet and a black hole">
  <defs>
    <radialGradient id="u-space" cx="38%" cy="40%" r="100%">
      <stop offset="0%"  stop-color="#0e1432"/>
      <stop offset="42%" stop-color="#070b1e"/>
      <stop offset="100%" stop-color="#02030a"/>
    </radialGradient>
    <radialGradient id="u-galaxy" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#fff6da" stop-opacity="0.95"/>
      <stop offset="22%"  stop-color="#ffd27a" stop-opacity="0.8"/>
      <stop offset="55%"  stop-color="#ff8a3c" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#5a2b6b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="u-arm" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#8fb6ff" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#bcd4ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffce7b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="u-disk" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#fff3d0"/>
      <stop offset="50%"  stop-color="#ff9d3c"/>
      <stop offset="100%" stop-color="#ff4d2e"/>
    </linearGradient>
    <!-- ringed planet -->
    <radialGradient id="u-planet" cx="38%" cy="34%" r="75%">
      <stop offset="0%"   stop-color="#ffe3a8"/>
      <stop offset="45%"  stop-color="#e9914a"/>
      <stop offset="100%" stop-color="#7c3b1e"/>
    </radialGradient>
    <linearGradient id="u-ring" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#ffd9a0" stop-opacity="0"/>
      <stop offset="25%"  stop-color="#ffce7b" stop-opacity="0.9"/>
      <stop offset="50%"  stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="75%"  stop-color="#ffce7b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffd9a0" stop-opacity="0"/>
    </linearGradient>
    <!-- starship -->
    <linearGradient id="u-hull" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#f4f8ff"/>
      <stop offset="50%"  stop-color="#c4d0ea"/>
      <stop offset="100%" stop-color="#76849f"/>
    </linearGradient>
    <linearGradient id="u-hull2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#dfe7f5"/>
      <stop offset="100%" stop-color="#8c97b0"/>
    </linearGradient>
    <radialGradient id="u-bussard" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#fff1d8"/>
      <stop offset="40%"  stop-color="#ff7a3c"/>
      <stop offset="100%" stop-color="#ff3a2e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="u-warp" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#d8f0ff"/>
      <stop offset="45%"  stop-color="#46a8ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#46a8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="u-deflector" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#bfe6ff"/>
      <stop offset="55%"  stop-color="#3aa0ff"/>
      <stop offset="100%" stop-color="#1b4f9e"/>
    </radialGradient>
    <linearGradient id="u-title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="55%"  stop-color="#ffd9a6"/>
      <stop offset="100%" stop-color="#ff8a3c"/>
    </linearGradient>
    <linearGradient id="u-gridfade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#02030a" stop-opacity="1"/>
      <stop offset="100%" stop-color="#02030a" stop-opacity="0"/>
    </linearGradient>

    <filter id="u-soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="u-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="u-blur2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs>

  <!-- ============ BACKDROP ============ -->
  <rect width="1200" height="360" fill="url(#u-space)"/>

  <!-- ============ PERSPECTIVE 3D GRID FLOOR (synthwave depth) ============ -->
  <g stroke="#ff8a3c" opacity="0.22">
    <!-- vertical lines converging to vanishing point (600,255) -->
    <g stroke-width="1">
      <line x1="600" y1="255" x2="-360" y2="360"/><line x1="600" y1="255" x2="-180" y2="360"/>
      <line x1="600" y1="255" x2="-20"  y2="360"/><line x1="600" y1="255" x2="120"  y2="360"/>
      <line x1="600" y1="255" x2="250"  y2="360"/><line x1="600" y1="255" x2="370"  y2="360"/>
      <line x1="600" y1="255" x2="480"  y2="360"/><line x1="600" y1="255" x2="600"  y2="360"/>
      <line x1="600" y1="255" x2="720"  y2="360"/><line x1="600" y1="255" x2="830"  y2="360"/>
      <line x1="600" y1="255" x2="950"  y2="360"/><line x1="600" y1="255" x2="1080" y2="360"/>
      <line x1="600" y1="255" x2="1220" y2="360"/><line x1="600" y1="255" x2="1380" y2="360"/>
      <line x1="600" y1="255" x2="1560" y2="360"/>
    </g>
    <!-- horizontal lines flowing toward the viewer (perspective spacing) -->
    <g stroke-width="1.4">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 26" dur="2.4s" repeatCount="indefinite"/>
        <line x1="0" y1="257.9" x2="1200" y2="257.9" opacity="0.35"/>
        <line x1="0" y1="266.7" x2="1200" y2="266.7" opacity="0.5"/>
        <line x1="0" y1="281.2" x2="1200" y2="281.2" opacity="0.7"/>
        <line x1="0" y1="301.7" x2="1200" y2="301.7" opacity="0.85"/>
        <line x1="0" y1="327.9" x2="1200" y2="327.9"/>
        <line x1="0" y1="360"   x2="1200" y2="360"/>
      </g>
    </g>
  </g>
  <!-- fade the grid into deep space near the horizon -->
  <rect x="0" y="250" width="1200" height="46" fill="url(#u-gridfade)"/>
  <!-- horizon glow line -->
  <rect x="0" y="254" width="1200" height="2" fill="#ffce7b" opacity="0.45" filter="url(#u-blur2)"/>

  <!-- ============ PARALLAX STARFIELDS ============ -->
  <g opacity="0.55">
    <g><animateTransform attributeName="transform" type="translate" from="0 0" to="-300 0" dur="60s" repeatCount="indefinite"/>
      <g fill="#9fb4e8">
        <circle cx="40" cy="60" r="0.8"/><circle cx="180" cy="120" r="0.7"/><circle cx="320" cy="40" r="0.9"/>
        <circle cx="470" cy="150" r="0.7"/><circle cx="610" cy="90" r="0.8"/><circle cx="760" cy="40" r="0.7"/>
        <circle cx="900" cy="50" r="0.9"/><circle cx="1040" cy="160" r="0.7"/><circle cx="1180" cy="110" r="0.8"/>
        <circle cx="1330" cy="60" r="0.8"/><circle cx="1470" cy="130" r="0.7"/><circle cx="110" cy="200" r="0.7"/>
      </g>
    </g>
  </g>
  <g opacity="0.8">
    <g><animateTransform attributeName="transform" type="translate" from="0 0" to="-600 0" dur="34s" repeatCount="indefinite"/>
      <g fill="#cdddff">
        <circle cx="70" cy="100" r="1.2"/><circle cx="250" cy="50" r="1.1"/><circle cx="430" cy="150" r="1.3"/>
        <circle cx="600" cy="70" r="1.1"/><circle cx="780" cy="60" r="1.2"/><circle cx="950" cy="120" r="1.3"/>
        <circle cx="1120" cy="60" r="1.1"/><circle cx="1290" cy="180" r="1.2"/><circle cx="1460" cy="90" r="1.2"/>
        <circle cx="200" cy="190" r="1.1"/><circle cx="1620" cy="140" r="1.2"/><circle cx="1740" cy="70" r="1.1"/>
      </g>
    </g>
  </g>
  <g>
    <g><animateTransform attributeName="transform" type="translate" from="0 0" to="-1200 0" dur="18s" repeatCount="indefinite"/>
      <g fill="#ffffff">
        <circle cx="120" cy="70" r="1.8"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.1s" repeatCount="indefinite"/></circle>
        <circle cx="380" cy="40" r="1.7"><animate attributeName="opacity" values="1;0.3;1" dur="2.6s" repeatCount="indefinite"/></circle>
        <circle cx="650" cy="110" r="2.0"><animate attributeName="opacity" values="0.5;1;0.5" dur="3.7s" repeatCount="indefinite"/></circle>
        <circle cx="900" cy="60" r="1.7"><animate attributeName="opacity" values="1;0.4;1" dur="2.9s" repeatCount="indefinite"/></circle>
        <circle cx="1150" cy="80" r="1.9"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.3s" repeatCount="indefinite"/></circle>
        <circle cx="1400" cy="120" r="1.8"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/></circle>
        <circle cx="1680" cy="60" r="1.9"><animate attributeName="opacity" values="0.5;1;0.5" dur="3.5s" repeatCount="indefinite"/></circle>
        <circle cx="2000" cy="90" r="1.8"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.0s" repeatCount="indefinite"/></circle>
      </g>
    </g>
  </g>

  <!-- ============ DISTANT BLACK HOLE (far left) ============ -->
  <g transform="translate(150 86)" opacity="0.9">
    <ellipse cx="0" cy="0" rx="58" ry="16" fill="none" stroke="url(#u-disk)" stroke-width="5" opacity="0.85" filter="url(#u-glow)" transform="rotate(-22)">
      <animateTransform attributeName="transform" type="rotate" from="-22 0 0" to="338 0 0" dur="26s" repeatCount="indefinite" additive="sum"/>
    </ellipse>
    <circle cx="0" cy="0" r="13" fill="#000000"/>
    <circle cx="0" cy="0" r="13" fill="none" stroke="#ffce7b" stroke-width="1" opacity="0.5">
      <animate attributeName="opacity" values="0.25;0.7;0.25" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ============ SPIRAL GALAXY (left-of-centre, tilted) ============ -->
  <g transform="translate(360 120) rotate(-18) scale(1 0.42)">
    <g><animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="48s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="0" rx="150" ry="150" fill="url(#u-galaxy)"/>
      <path d="M0 0 C 72 -24 120 -8 150 48 C 96 24 48 32 0 0 Z" fill="url(#u-arm)" opacity="0.7"/>
      <path d="M0 0 C -72 24 -120 8 -150 -48 C -96 -24 -48 -32 0 0 Z" fill="url(#u-arm)" opacity="0.7"/>
      <path d="M0 0 C 32 72 8 112 -56 140 C -24 88 -24 48 0 0 Z" fill="url(#u-arm)" opacity="0.5"/>
      <path d="M0 0 C -32 -72 -8 -112 56 -140 C 24 -88 24 -48 0 0 Z" fill="url(#u-arm)" opacity="0.5"/>
    </g>
    <circle cx="0" cy="0" r="18" fill="#fff6da">
      <animate attributeName="r" values="16;22;16" dur="5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ============ RINGED PLANET + ORBITING MOON (right) ============ -->
  <g transform="translate(1050 96)">
    <!-- back half of ring -->
    <path d="M -64 6 A 64 18 0 0 1 64 6" fill="none" stroke="url(#u-ring)" stroke-width="7" transform="rotate(-18)"/>
    <!-- planet -->
    <circle cx="0" cy="0" r="33" fill="url(#u-planet)"/>
    <ellipse cx="-9" cy="-9" rx="13" ry="7" fill="#fff1d0" opacity="0.25"/>
    <path d="M -30 8 A 33 33 0 0 0 30 8" fill="#5a2912" opacity="0.18"/>
    <!-- front half of ring -->
    <path d="M -64 6 A 64 18 0 0 0 64 6" fill="none" stroke="url(#u-ring)" stroke-width="7" transform="rotate(-18)"/>
    <!-- orbiting moon -->
    <circle r="3.2" fill="#dfe9ff">
      <animateMotion dur="14s" repeatCount="indefinite" path="M 0 -26 A 66 20 0 1 1 0 26 A 66 20 0 1 1 0 -26" rotate="auto"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="14s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ============ NEBULA WISP ============ -->
  <g filter="url(#u-soft)" opacity="0.4">
    <ellipse cx="520" cy="215" rx="200" ry="46" fill="#5a2b8f"><animate attributeName="opacity" values="0.3;0.55;0.3" dur="9s" repeatCount="indefinite"/></ellipse>
  </g>

  <!-- ============ WARP STREAKS ============ -->
  <g stroke="#bcd4ff" stroke-linecap="round">
    <line x1="1250" y1="150" x2="1180" y2="152" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;0.9;0" dur="1.6s" begin="0.3s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-1500 0" dur="1.6s" begin="0.3s" repeatCount="indefinite"/>
    </line>
    <line x1="1300" y1="120" x2="1210" y2="122" stroke-width="2.4" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="1.3s" begin="0.9s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-1500 0" dur="1.3s" begin="0.9s" repeatCount="indefinite"/>
    </line>
    <line x1="1280" y1="200" x2="1220" y2="201" stroke-width="1.6" opacity="0">
      <animate attributeName="opacity" values="0;0.8;0" dur="2.0s" begin="1.7s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-1500 0" dur="2.0s" begin="1.7s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- ============ STARSHIP (Constitution-class style, hero) ============ -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="-30 0; 40 0; -30 0" dur="24s" repeatCount="indefinite" additive="sum"/>
    <g transform="translate(600 168) scale(1.15)">
      <animateTransform attributeName="transform" type="translate" values="0 -5; 0 5; 0 -5" dur="6.5s" repeatCount="indefinite" additive="sum"/>
      <g transform="rotate(-7)">

        <!-- warp engine trails (behind, left) -->
        <ellipse cx="-118" cy="-19" rx="78" ry="6" fill="url(#u-warp)" opacity="0.85">
          <animate attributeName="rx" values="60;92;60" dur="1.3s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.55;0.95;0.55" dur="1.3s" repeatCount="indefinite"/>
        </ellipse>
        <ellipse cx="-112" cy="-31" rx="66" ry="5" fill="url(#u-warp)" opacity="0.7">
          <animate attributeName="rx" values="50;80;50" dur="1.5s" repeatCount="indefinite"/>
        </ellipse>

        <!-- nacelle pylons -->
        <path d="M-18 14 L -44 -17 L -38 -17 L -10 14 Z" fill="url(#u-hull2)"/>
        <path d="M-14 12 L -34 -29 L -28 -29 L -8 12 Z" fill="#9aa6bf"/>

        <!-- warp nacelle (far/upper, 3D offset) -->
        <g opacity="0.92">
          <rect x="-44" y="-34" width="56" height="9" rx="4.5" fill="url(#u-hull2)"/>
          <circle cx="12" cy="-29.5" r="4.2" fill="url(#u-bussard)"><animate attributeName="opacity" values="0.6;1;0.6" dur="1.1s" repeatCount="indefinite"/></circle>
          <rect x="-40" y="-31.5" width="34" height="2.2" rx="1" fill="#46a8ff"><animate attributeName="opacity" values="0.5;1;0.5" dur="1.6s" repeatCount="indefinite"/></rect>
          <circle cx="-44" cy="-29.5" r="4.5" fill="url(#u-warp)"><animate attributeName="r" values="3.5;6;3.5" dur="1.2s" repeatCount="indefinite"/></circle>
        </g>

        <!-- warp nacelle (near/lower) -->
        <g>
          <rect x="-48" y="-23" width="60" height="11" rx="5.5" fill="url(#u-hull)"/>
          <circle cx="12" cy="-17.5" r="5" fill="url(#u-bussard)"><animate attributeName="opacity" values="0.6;1;0.6" dur="1.0s" repeatCount="indefinite"/></circle>
          <rect x="-44" y="-19.5" width="38" height="2.6" rx="1.3" fill="#46a8ff"><animate attributeName="opacity" values="0.5;1;0.5" dur="1.4s" repeatCount="indefinite"/></rect>
          <circle cx="-48" cy="-17.5" r="5.5" fill="url(#u-warp)"><animate attributeName="r" values="4;7;4" dur="1.1s" repeatCount="indefinite"/></circle>
        </g>

        <!-- secondary (engineering) hull -->
        <ellipse cx="-4" cy="20" rx="50" ry="11" fill="url(#u-hull)"/>
        <ellipse cx="-4" cy="17" rx="44" ry="5" fill="#eef3ff" opacity="0.5"/>
        <!-- deflector dish at the front -->
        <circle cx="42" cy="20" r="6" fill="url(#u-deflector)"><animate attributeName="opacity" values="0.7;1;0.7" dur="2.4s" repeatCount="indefinite"/></circle>

        <!-- neck connecting saucer to hull -->
        <path d="M2 10 L 22 4 L 26 12 L 6 18 Z" fill="url(#u-hull2)"/>

        <!-- saucer section -->
        <ellipse cx="20" cy="-2" rx="56" ry="18" fill="url(#u-hull)"/>
        <ellipse cx="20" cy="-2" rx="40" ry="12" fill="#dfe7f5" opacity="0.55"/>
        <ellipse cx="20" cy="-2" rx="22" ry="6.5" fill="#aebbd6" opacity="0.6"/>
        <!-- bridge dome -->
        <ellipse cx="20" cy="-7" rx="9" ry="4.2" fill="url(#u-hull)"/>
        <circle cx="20" cy="-8" r="2.2" fill="#ffce7b"><animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite"/></circle>
        <!-- leading-edge running lights -->
        <circle cx="73" cy="-2" r="1.7" fill="#ff5e5e"><animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/></circle>
        <circle cx="-33" cy="-2" r="1.7" fill="#5effa0"><animate attributeName="opacity" values="1;0;1" dur="2s" repeatCount="indefinite"/></circle>
      </g>
    </g>
  </g>

  <!-- ============ TITLE ============ -->
  <g filter="url(#u-glow)" font-family="'JetBrains Mono','Courier New',monospace">
    <text x="592" y="332" text-anchor="middle" font-size="21" font-weight="700" letter-spacing="4" fill="url(#u-title)">
      click to enter my universe
      <tspan dx="8" fill="#ff8a3c">&#8594;</tspan>
    </text>
  </g>
  <rect x="838" y="317" width="10" height="19" fill="#ffce7b">
    <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
