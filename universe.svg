<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" fill="none" role="img" aria-label="Enter my universe - a starship cruising past a galaxy and a distant black hole">
  <defs>
    <!-- deep-space backdrop -->
    <radialGradient id="u-space" cx="38%" cy="42%" r="95%">
      <stop offset="0%"  stop-color="#0d1330"/>
      <stop offset="40%" stop-color="#070b1e"/>
      <stop offset="100%" stop-color="#02030a"/>
    </radialGradient>
    <!-- galaxy core -->
    <radialGradient id="u-galaxy" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#fff6da" stop-opacity="0.95"/>
      <stop offset="22%"  stop-color="#ffd27a" stop-opacity="0.8"/>
      <stop offset="55%"  stop-color="#ff8a3c" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#5a2b6b" stop-opacity="0"/>
    </radialGradient>
    <!-- spiral arm sweep -->
    <linearGradient id="u-arm" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#8fb6ff" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#bcd4ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffce7b" stop-opacity="0"/>
    </linearGradient>
    <!-- black-hole accretion ring -->
    <linearGradient id="u-disk" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#fff3d0"/>
      <stop offset="50%"  stop-color="#ff9d3c"/>
      <stop offset="100%" stop-color="#ff4d2e"/>
    </linearGradient>
    <!-- starship body -->
    <linearGradient id="u-hull" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#eaf1ff"/>
      <stop offset="55%"  stop-color="#aebfe0"/>
      <stop offset="100%" stop-color="#5a6b94"/>
    </linearGradient>
    <radialGradient id="u-engine" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#bfe0ff"/>
      <stop offset="45%"  stop-color="#4aa6ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4aa6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="u-title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="55%"  stop-color="#ffd9a6"/>
      <stop offset="100%" stop-color="#ff8a3c"/>
    </linearGradient>

    <filter id="u-soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="u-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- one reusable parallax star layer is built inline below -->
  </defs>

  <!-- ============ BACKDROP ============ -->
  <rect width="1200" height="360" fill="url(#u-space)"/>

  <!-- ============ PARALLAX STARFIELDS (depth = 3D) ============ -->
  <!-- far layer: tiny, dim, slow drift -->
  <g opacity="0.55">
    <g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-300 0" dur="60s" repeatCount="indefinite"/>
      <g fill="#9fb4e8">
        <circle cx="40"  cy="60"  r="0.8"/><circle cx="180" cy="120" r="0.7"/><circle cx="320" cy="40"  r="0.9"/>
        <circle cx="470" cy="200" r="0.7"/><circle cx="610" cy="90"  r="0.8"/><circle cx="760" cy="160" r="0.7"/>
        <circle cx="900" cy="50"  r="0.9"/><circle cx="1040" cy="220" r="0.7"/><circle cx="1180" cy="110" r="0.8"/>
        <circle cx="1330" cy="60" r="0.8"/><circle cx="1470" cy="170" r="0.7"/>
        <circle cx="110" cy="280" r="0.7"/><circle cx="540" cy="300" r="0.8"/><circle cx="980" cy="290" r="0.7"/>
      </g>
    </g>
  </g>
  <!-- mid layer -->
  <g opacity="0.8">
    <g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-600 0" dur="34s" repeatCount="indefinite"/>
      <g fill="#cdddff">
        <circle cx="70"  cy="100" r="1.2"/><circle cx="250" cy="50"  r="1.1"/><circle cx="430" cy="150" r="1.3"/>
        <circle cx="600" cy="70"  r="1.1"/><circle cx="780" cy="210" r="1.2"/><circle cx="950" cy="120" r="1.3"/>
        <circle cx="1120" cy="60" r="1.1"/><circle cx="1290" cy="180" r="1.2"/><circle cx="1460" cy="90" r="1.2"/>
        <circle cx="200" cy="240" r="1.1"/><circle cx="700" cy="300" r="1.2"/><circle cx="1180" cy="260" r="1.1"/>
        <circle cx="1620" cy="140" r="1.2"/><circle cx="1740" cy="70" r="1.1"/>
      </g>
    </g>
  </g>
  <!-- near layer: big, bright, fast = closest -->
  <g>
    <g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-1200 0" dur="18s" repeatCount="indefinite"/>
      <g fill="#ffffff">
        <circle cx="120" cy="70"  r="1.8"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.1s" repeatCount="indefinite"/></circle>
        <circle cx="380" cy="190" r="1.7"><animate attributeName="opacity" values="1;0.3;1" dur="2.6s" repeatCount="indefinite"/></circle>
        <circle cx="650" cy="110" r="2.0"><animate attributeName="opacity" values="0.5;1;0.5" dur="3.7s" repeatCount="indefinite"/></circle>
        <circle cx="900" cy="240" r="1.7"><animate attributeName="opacity" values="1;0.4;1" dur="2.9s" repeatCount="indefinite"/></circle>
        <circle cx="1150" cy="80" r="1.9"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.3s" repeatCount="indefinite"/></circle>
        <circle cx="1400" cy="200" r="1.8"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/></circle>
        <circle cx="1680" cy="120" r="1.9"><animate attributeName="opacity" values="0.5;1;0.5" dur="3.5s" repeatCount="indefinite"/></circle>
        <circle cx="2000" cy="90" r="1.8"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.0s" repeatCount="indefinite"/></circle>
      </g>
    </g>
  </g>

  <!-- ============ DISTANT BLACK HOLE (top-left, behind it all) ============ -->
  <g transform="translate(232 96)" opacity="0.92">
    <ellipse cx="0" cy="0" rx="70" ry="20" fill="none" stroke="url(#u-disk)" stroke-width="6" opacity="0.85" filter="url(#u-glow)" transform="rotate(-22)">
      <animateTransform attributeName="transform" type="rotate" from="-22 0 0" to="338 0 0" dur="26s" repeatCount="indefinite" additive="sum"/>
    </ellipse>
    <ellipse cx="0" cy="0" rx="46" ry="13" fill="none" stroke="url(#u-disk)" stroke-width="3.5" opacity="0.6" transform="rotate(-22)">
      <animateTransform attributeName="transform" type="rotate" from="338 0 0" to="-22 0 0" dur="18s" repeatCount="indefinite" additive="sum"/>
    </ellipse>
    <circle cx="0" cy="0" r="16" fill="#000000"/>
    <circle cx="0" cy="0" r="16" fill="none" stroke="#ffce7b" stroke-width="1" opacity="0.5">
      <animate attributeName="opacity" values="0.25;0.7;0.25" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ============ SPIRAL GALAXY (mid-distance, perspective-tilted) ============ -->
  <g transform="translate(840 150) rotate(-18) scale(1 0.42)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="48s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="0" rx="190" ry="190" fill="url(#u-galaxy)"/>
      <path d="M0 0 C 90 -30 150 -10 190 60 C 120 30 60 40 0 0 Z" fill="url(#u-arm)" opacity="0.7"/>
      <path d="M0 0 C -90 30 -150 10 -190 -60 C -120 -30 -60 -40 0 0 Z" fill="url(#u-arm)" opacity="0.7"/>
      <path d="M0 0 C 40 90 10 140 -70 175 C -30 110 -30 60 0 0 Z" fill="url(#u-arm)" opacity="0.5"/>
      <path d="M0 0 C -40 -90 -10 -140 70 -175 C 30 -110 30 -60 0 0 Z" fill="url(#u-arm)" opacity="0.5"/>
    </g>
    <circle cx="0" cy="0" r="22" fill="#fff6da">
      <animate attributeName="r" values="20;26;20" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.85;1;0.85" dur="5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ============ NEBULA WISPS ============ -->
  <g filter="url(#u-soft)" opacity="0.5">
    <ellipse cx="560" cy="300" rx="220" ry="60" fill="#5a2b8f">
      <animate attributeName="opacity" values="0.35;0.6;0.35" dur="9s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="380" cy="280" rx="150" ry="50" fill="#1f5fae">
      <animate attributeName="opacity" values="0.5;0.25;0.5" dur="11s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- ============ WARP STREAKS (occasional zip-past) ============ -->
  <g stroke="#bcd4ff" stroke-linecap="round">
    <line x1="1250" y1="130" x2="1180" y2="132" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;0.9;0" dur="1.6s" begin="0.3s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-1500 0" dur="1.6s" begin="0.3s" repeatCount="indefinite"/>
    </line>
    <line x1="1300" y1="220" x2="1210" y2="223" stroke-width="2.4" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="1.3s" begin="0.9s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-1500 0" dur="1.3s" begin="0.9s" repeatCount="indefinite"/>
    </line>
    <line x1="1280" y1="70" x2="1220" y2="71" stroke-width="1.6" opacity="0">
      <animate attributeName="opacity" values="0;0.8;0" dur="2.0s" begin="1.7s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-1500 0" dur="2.0s" begin="1.7s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- ============ STARSHIP (foreground, gentle approach + bob) ============ -->
  <g>
    <!-- slow drift across with subtle scale-up = flying toward viewer -->
    <animateTransform attributeName="transform" type="translate" values="-40 0; 60 0; -40 0" dur="22s" repeatCount="indefinite" additive="sum"/>
    <g transform="translate(560 196)">
      <animateTransform attributeName="transform" type="translate" values="0 -6; 0 6; 0 -6" dur="6s" repeatCount="indefinite" additive="sum"/>
      <g transform="rotate(-8)">
        <!-- engine glow trail -->
        <ellipse cx="-150" cy="6" rx="120" ry="10" fill="url(#u-engine)" opacity="0.8">
          <animate attributeName="opacity" values="0.55;0.95;0.55" dur="1.4s" repeatCount="indefinite"/>
          <animate attributeName="rx" values="100;140;100" dur="1.4s" repeatCount="indefinite"/>
        </ellipse>
        <!-- secondary hull -->
        <rect x="-70" y="16" width="120" height="13" rx="6.5" fill="url(#u-hull)"/>
        <!-- nacelle struts -->
        <path d="M10 14 L 34 24 M -20 14 L 6 24" stroke="#7d8db5" stroke-width="3"/>
        <!-- main hull -->
        <path d="M-78 0 L 44 -2 Q 70 0 44 6 L -78 8 Q -92 4 -78 0 Z" fill="url(#u-hull)"/>
        <!-- saucer -->
        <ellipse cx="44" cy="2" rx="40" ry="15" fill="url(#u-hull)"/>
        <ellipse cx="50" cy="0" rx="20" ry="7" fill="#dfe9ff"/>
        <circle cx="56" cy="0" r="2.6" fill="#ffce7b">
          <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite"/>
        </circle>
        <!-- hull running lights -->
        <circle cx="-40" cy="2" r="1.6" fill="#ff5e5e"><animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/></circle>
        <circle cx="-10" cy="2" r="1.6" fill="#5effa0"><animate attributeName="opacity" values="1;0;1" dur="2s" repeatCount="indefinite"/></circle>
        <!-- engine bloom at the back -->
        <circle cx="-72" cy="4" r="6" fill="url(#u-engine)">
          <animate attributeName="r" values="5;8;5" dur="1.2s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>
  </g>

  <!-- ============ TITLE ============ -->
  <g filter="url(#u-glow)" font-family="'JetBrains Mono','Courier New',monospace">
    <text x="600" y="334" text-anchor="middle" font-size="22" font-weight="700" letter-spacing="6" fill="url(#u-title)">
      ENTER MY UNIVERSE
      <tspan dx="6" fill="#ff8a3c">&#8594;</tspan>
    </text>
  </g>
  <!-- blinking warp cursor -->
  <rect x="828" y="318" width="11" height="20" fill="#ffce7b">
    <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
